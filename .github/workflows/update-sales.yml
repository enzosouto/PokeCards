name: Update Sales

on:
  schedule:
    - cron: "0 */6 * * *" # every 6h, matches CACHE_TTL_HOURS in tracked_card_repo.py
  workflow_dispatch:

jobs:
  update-sales:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: python -m etl.fetch_sales
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          THE_CARD_API_KEY: ${{ secrets.THE_CARD_API_KEY }}
          TRAWL_API_KEY: ${{ secrets.TRAWL_API_KEY }}

      - run: python -m etl.update_prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
